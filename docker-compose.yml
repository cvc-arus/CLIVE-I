services:
  ollama:
    image: ollama/ollama
    container_name: clive-ollama
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - /data/ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: clive-webui
    restart: unless-stopped
    ports:
      - "3000:8080"
    volumes:
      - /data/openwebui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - VECTOR_DB=pgvector
      - PGVECTOR_DB_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CONTENT_EXTRACTION_ENGINE=tika
      - TIKA_SERVER_URL=http://tika:9998
      - RAG_EMBEDDING_ENGINE=ollama
      - RAG_EMBEDDING_MODEL=nomic-embed-text
      - ENABLE_RAG_HYBRID_SEARCH=true
    depends_on:
      postgres:
        condition: service_healthy
      tika:
        condition: service_started
      ollama:
        condition: service_started

  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: clive-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /data/pgvector_data:/var/lib/postgresql/data
      - ./configs/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tika:
    image: apache/tika:3.3.1.0-full
    container_name: clive-tika
    restart: unless-stopped
    ports:
      - "127.0.0.1:9998:9998"

volumes:
  ollama_data:
  openwebui_data:
  pgvector_data: