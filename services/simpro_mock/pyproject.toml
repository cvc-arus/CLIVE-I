[project]
name = "simpro-mock"
version = "0.1.0"
description = "Mock Simpro REST API service for CLIVE development"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]